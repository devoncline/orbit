<!doctype html><html><head><meta charset="utf-8"><title>Orbit layout review</title><style>body{margin:0;background:#252a35;color:white;font:14px system-ui;height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden}header{padding:10px;z-index:2;background:#252a35;display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,select{padding:8px}iframe{border:0;display:block;margin:0 auto;background:#080e19;width:min(100%,var(--review-width,1440px));height:100%}#stage{overflow:auto;min-height:0}</style></head><body><header>Isolated mock review <select id="scenario"><option>focus</option><option>visual</option><option>failure</option><option value="guided">guided profile</option><option value="explore">explore profile</option></select><button data-width="1440">1440</button><button data-width="768">768</button><button data-width="390">390</button><button data-width="320">320</button><button id="fail-image">Fail next image</button><output id="measure"></output></header><div id="stage"><iframe title="Study layout preview"></iframe></div><script type="module">
const frame=document.querySelector('iframe');frame.src='/.orbit-review-frame.html?scenario=focus';document.querySelector('#scenario').onchange=e=>frame.src='/.orbit-review-frame.html?scenario='+e.target.value;document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>frame.style.setProperty('--review-width',button.dataset.width+'px'));document.querySelector("#fail-image").onclick=()=>frame.contentDocument.documentElement.dataset.failNextImage="true";setInterval(()=>{const doc=frame.contentDocument;if(doc?.querySelector('.study-session'))document.querySelector('#measure').textContent=`Viewport ${frame.clientWidth} / document ${doc.documentElement.scrollWidth} / ${doc.querySelector('.study-session').dataset.presentationMode} / images ${doc.documentElement.dataset.imageRequests || 0}`},300);
</script></body></html>
